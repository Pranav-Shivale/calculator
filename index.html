<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1 id="title">Simple Calculator</h1>
  <div class="container">
    <div class="display">
      0
    </div>
    <div class="row">
      <button class="clear-btn">AC</button>
      <button class="equal-btn">=</button>
      <button class="backspace-btn">&larr;</button>
    </div>
    <div class="row">
      <button class="num-btn">7</button>
      <button class="num-btn">8</button>
      <button class="num-btn">9</button>
      <button class="op-btn">/</button>
    </div>
    <div class="row">
      <button class="num-btn">4</button>
      <button class="num-btn">5</button>
      <button class="num-btn">6</button>
      <button class="op-btn">*</button>
    </div>
    <div class="row">
      <button class="num-btn">1</button>
      <button class="num-btn">2</button>
      <button class="num-btn">3</button>
      <button class="op-btn">-</button>
    </div>
    <div class="row">
      <button class="num-btn zero-btn">0</button>
      <button class="decimal-btn">.</button>
      <button class="op-btn">+</button>
    </div>
  </div>
</body>
</html>
